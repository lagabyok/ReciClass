<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ReciClass identifica categorías de residuos a partir de una imagen.">
  <title>ReciClass | Clasificador de residuos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo">♻</div>
      <div>
        <p class="eyebrow">INTELIGENCIA ARTIFICIAL · REALWASTE</p>
        <h1>ReciClass</h1>
        <p class="subtitle">Clasificá residuos a partir de una imagen.</p>
      </div>
    </header>

    <section class="panel">
      <h2>Analizar una imagen</h2>
      <p class="help">Seleccioná una fotografía JPG, PNG o WEBP de hasta 10 MB.</p>

      <label class="upload" for="imageInput">
        <span class="upload-icon">＋</span>
        <strong>Elegir imagen</strong>
        <span id="fileName">Todavía no seleccionaste un archivo</span>
      </label>
      <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp">

      <div class="preview-wrap" id="previewWrap" hidden>
        <img id="preview" alt="Vista previa de la imagen seleccionada">
      </div>

      <button id="predictButton" disabled>Clasificar residuo</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="result" class="result" hidden>
        <p class="eyebrow">RESULTADO DEL MODELO</p>
        <h2 id="prediction"></h2>
        <p id="confidence" class="confidence"></p>
        <h3>Probabilidades por categoría</h3>
        <div id="probabilities" class="probabilities"></div>
      </section>
    </section>

    <footer>ReciClass · Proyecto académico de clasificación de residuos</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
